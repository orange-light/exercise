    <div id="page" class="position-relative">
        <!-- ============= 導覽列 ============= -->
        <header id="header" class="l-header"></header>
        <!-- =============end 導覽列 ============= -->
        <!-- ============= 主要內容區 ============= -->
        <main class="overflow-hidden">
            <!-- 受賞者リスト -->
            <section class="p-winner u-py-400" id="winner_Id">
                <div class="container">
                    <!-- section標題 -->
                    <div class="u-mb-300 u-mb-md-400 text-center" data-aos="fade-up">
                        <div class="c-title-main-title d-inline-block position-relative">
                            <div class="p-winner-product">
                                <img src="assets/img/index/img_signUp_product.png" alt="" class="img-fluid">
                            </div>
                            <img src="assets/img/index/main_title-07-pc.svg" alt="受賞者リスト，入選名單"
                                class="img-fluid d-none d-md-inline-block" />
                            <img src="assets/img/index/main_title-07-mb.svg" alt="受賞者リスト，入選名單"
                                class="img-fluid d-md-none" />
                        </div>
                    </div>
                    <!-- END section標題 -->
                    <div id="appwin" class="p-winner-list">
                        <div class="row justify-content-center">
                            <div class="col-xl-10">
                                <div class="c-frame u-p-050 u-mb-200" v-if="winners == ''">
                                    <div class="c-frame">
                                        <div class="p-winner-list-title text-center u-py-200">
                                            <img src="assets/img/index/img_winner_slogan-01-pc.svg" alt="小神盾體驗隊長名單"
                                                class="img-fluid">
                                                <h2 class="u-mt-100">{{winners.title}}</h2>
                                        </div>
                                        <div class="text-center py-5">
                                            <h3 class="u-text-primary">{{openItem}}</h3>
                                        </div>
                                    </div>
                                </div>
                                <div class="c-frame u-p-050 u-mb-200" v-else v-for="(winner, index) in winners" :key="index">
                                    <div class="c-frame">
                                        <div class="p-winner-list-title text-center u-py-200">
                                            <img src="assets/img/index/img_winner_slogan-01-pc.svg" alt="小神盾體驗隊長名單"
                                                class="img-fluid">
                                                <h2 class="u-mt-100">{{winner.title}}</h2>
                                        </div>
                                        <div data-aos="fade-up">
                                            <table class="l-table c-articleTable c-articleTable-rwd">
                                                <thead>
                                                    <tr>
                                                        <th scope="col"><span class="sr-only">No.</span></th>
                                                        <th scope="col"><span>姓名</span></th>
                                                        <th scope="col"><span>電話</span></th>
                                                        <th scope="col"><span>E-mail</span></th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr v-for="(item,index) in winner.winners" :key="item.name">
                                                        <th scope="row" data-th="No.">
                                                            <div class="d-flex justify-content-xl-end text-left">
                                                                <span>{{index + 1}}</span>
                                                            </div>
                                                        </th>
                                                        <td data-th="姓名">
                                                            <span>{{item.name}}</span>
                                                        </td>
                                                        <td data-th="電話">
                                                            <span>{{item.tel}}</span>
                                                        </td>
                                                        <td data-th="E-mail">
                                                            <span>{{item.email}}</span>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <!-- End 受賞者リスト -->
        </main>
        <!-- =============end 主要內容區 ============= -->
        <!-- ============= footer ============= -->
        <footer id="footer" class="l-footer"></footer>
        <!-- =============end footer ============= -->
    </div>

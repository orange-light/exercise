    <div id="store">
      <!-- ============= 導覽列 ============= -->
      <header id="header" class="l-header"></header>
      <!-- =============end 導覽列 ============= -->
      <!-- ============= 主要內容區 ============= -->
      <main>
        <div class="p-mb-bg"></div>
        <!-- 頁面標題 -->
        <section class="u-mt-300">
          <div class="container">
            <h2 class="c-title-main mb-0">通路資訊</h2>
          </div>
        </section>
        <!-- end 頁面標題 -->
        <section class="u-mt-300 u-pb-300">
          <div class="container" id="filter">
            <div class="row justify-content-center">
              <div class="col-xl-10">
                <!-- 下拉選單 -->
                <div class="u-mb-300 row">
                  <div class="col-12 col-lg-3 mb-3 mb-lg-0">
                    <div class="row align-items-center">
                      <div class="col-lg-5 col-3">
                        <label for="citySelect_Id" class="mb-0 pr-3 text-nowrap"
                          >請選擇縣市</label
                        >
                      </div>
                      <div class="col-lg-7 col-9 pl-lg-4">
                        <select
                          name="area"
                          id="areaSelect_Id"
                          class="l-form-field l-form-select"
                          v-model="selected_area"
                          @change="area_change(selected_area)"
                        >
                          <option value="all">全部</option>
                          <option value="基隆市">基隆市</option>
                          <option value="新北市">新北市</option>
                          <option value="台北市" selected>台北市</option>
                          <option value="桃園市">桃園市</option>
                          <option value="新竹市">新竹市</option>
                          <option value="新竹縣">新竹縣</option>
                          <option value="苗栗縣">苗栗縣</option>
                          <option value="台中市">台中市</option>
                          <option value="彰化縣">彰化縣</option>
                          <option value="南投縣">南投縣</option>
                          <option value="雲林縣">雲林縣</option>
                          <option value="嘉義市">嘉義市</option>
                          <option value="嘉義縣">嘉義縣</option>
                          <option value="台南市">台南市</option>
                          <option value="高雄市">高雄市</option>
                          <option value="屏東縣">屏東縣</option>
                          <option value="宜蘭縣">宜蘭縣</option>
                          <option value="花蓮縣">花蓮縣</option>
                          <option value="台東縣">台東縣</option>
                          <option value="澎湖縣">澎湖縣</option>
                          <option value="金門縣">金門縣</option>
                          <option value="連江縣">連江縣</option>
                        </select>
                      </div>
                    </div>
                  </div>
                  <div class="col-12 col-lg-3 p-store-border mb-3 mb-lg-0">
                    <div class="row align-items-center">
                      <div class="offset-lg-1 col-lg-2 col-3">
                        <label for="city_area" class="mb-0 pr-3 text-nowrap"
                          >區域</label
                        >
                      </div>
                      <div class="col-lg-7 col-9 pl-lg-4">
                        <select
                          name="city_area"
                          id="city_area"
                          v-model="selected_city_area"
                          class="l-form-field l-form-select"
                          @change="city_area_change()"
                        >
                          <option value="" selected>全區</option>

                          <option
                            v-for="item in city_areas"
                            :value="item.city_area"
                            :key="item.city_area"
                          >
                            {{item.city_area}}
                          </option>
                        </select>
                      </div>
                    </div>
                  </div>
                  <div class="col-12 col-lg-6">
                    <div class="row align-items-center pl-lg-4">
                      <div class="col-lg-2 col-3">
                        <label for="qtext" class="mb-0 pr-3 text-nowrap"
                          >快速搜尋</label
                        >
                      </div>
                      <div class="col-lg-10 col-9 d-flex pl-lg-4">
                        <input
                          type="text"
                          name="qtext"
                          id="qtext"
                          placeholder="請輸入通路名稱或地址"
                          class="l-form-field p-store-input px-3 py-1 flex-grow-1 mr-2"
                          v-on:keyup.enter="query()"
                        />
                        <button
                          type="button"
                          class="p-store-input-btn px-3 text-nowrap"
                          v-on:click="query()"
                        >
                          確定
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
                <!-- end 下拉選單 -->
                <!-- 通路表格 -->
                <div v-for="(section, index) in sections" :key="index">
                  <table
                    class="c-articleTable c-articleTable-rwd c-articleTable--striped"
                  >
                    <thead>
                      <tr>
                        <th scope="col"><span>通路名稱</span></th>
                        <th scope="col"><span>電話</span></th>
                        <th scope="col"><span>地址</span></th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr
                        v-if="rowData(selected_area, selected_city_area, qtext) == 0"
                      >
                        <td colspan="3" class="col-12 py-3 text-center">
                          本區無門市通路
                        </td>
                      </tr>
                      <tr
                        v-for="row in rowData(selected_area, selected_city_area, qtext)"
                        v-else
                      >
                        <td scope="row" data-th="門市">
                          <span>{{row.store}}</span>
                        </td>
                        <td data-th="電話">
                          <span>
                            <a v-bind:href="'tel:' + row.tel">{{row.tel}}</a>
                          </span>
                        </td>
                        <td data-th="地址">
                          <span>
                            <a
                              v-bind:href="'https://www.google.com/maps/place/' + row.address"
                              target="_blank"
                              >{{row.address}}</a
                            >
                          </span>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
                <!-- end 通路表格 -->
              </div>
            </div>
          </div>
        </section>
        <section class="u-mb-300">
          <div class="container">
            <div class="row justify-content-center py-4">
              <div class="col-xl-10">
                <p class="mb-0 text-center text-dark">
                  【您也可於楓康超市、寶家的全台門市中購買費特肯酒款。供貨數量與時間請以門市為準。】
                </p>
              </div>
            </div>
          </div>
        </section>
      </main>

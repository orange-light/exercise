<!DOCTYPE html>
<html lang="zh-tw">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>永豐基金會 | 申請報名表</title>
  <meta name="keyword" content="關鍵字" />
  <meta name="description" content="描述" />
  <meta name="author" content="作者" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1" charset="UTF-8" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="stylesheet" href="assets/plugins/bootstrap@4.5.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/plugins/fontawesome@5.15.4/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/main.css" />
</head>

<body>
  <noscript>
    <span class="h2 d-block text-center text-light bg-danger p-3 mb-0">
      您的瀏覽器不支援JavaScript功能，若網頁功能無法正常使用時，請開啟瀏覽器JavaScript狀態。
    </span>
  </noscript>
  <div id="page">
    <!-- ============= 導覽列 ============= -->
    <header id="header" class="l-header"></header>
    <!-- =============end 導覽列 ============= -->

    <!-- ============= 主要內容區 ============= -->
    <main>
      <section>
        <div class="container">
          <div class="c-breadcrumbs u-py-100 u-font-14">
            <a href="#" class="mr-2">首頁</a>
            /
            <a href="#" class="mx-2">小店永豐計畫</a>
            /
            <a href="#" class="ml-2">投稿報名</a>
          </div>
        </div>
        <div class="container u-pt-200 u-pb-400 u-pt-md-400 u-pb-md-600">
          <div class="d-flex flex-column text-center justify-content-center">
            <p class="u-text-primary m-0 u-pb-050">Application Form</p>
            <h3 class="u-font-weight-600 m-0 u-pb-250">
              小店永豐計畫
            </h3>
            <p class="u-text-primary u-font-16 mb-2 d-md-none">Step 1</p>
            <div class="d-flex justify-content-center align-items-center u-pb-400">
              <div class="p-form-step pb-2">
                <p class="u-text-primary u-font-14 mb-1 d-none d-md-block">
                  Step 1
                </p>
                基本資料
              </div>
              <img class="u-px-100 u-pb-050 u-pb-md-000 u-pt-md-100" src="assets/img/form/arrow.svg" />
              <div class="pb-2">
                <p class="u-text-primary u-font-14 mb-1 d-none d-md-block">
                  &ensp;
                </p>
                公司資料
              </div>
              <img class="u-px-100 u-pb-050 u-pb-md-000 u-pt-md-100" src="assets/img/form/arrow.svg" />
              <div class="pb-2">
                <p class="u-text-primary u-font-14 mb-1 d-none d-md-block">
                  &ensp;
                </p>
                審核資料
              </div>
              <img class="u-px-100 u-pb-050 u-pb-md-000 u-pt-md-100" src="assets/img/form/arrow.svg" />
              <div class="pb-2">
                <p class="u-text-primary u-font-14 mb-1 d-none d-md-block">
                  &ensp;
                </p>
                其他資料
              </div>
            </div>
          </div>
          <div class="p-form-title mx-auto">
            <div class="d-flex u-pb-250">
              <div class="p-form-title-line col"></div>
              <div class="position-relative p-form-title-textbox">
                <div class="p-form-title-text">基本資料</div>
              </div>
              <div class="p-form-title-line col"></div>
            </div>
            <p class="m-0 u-pb-200">
              請填寫以下資訊
              <br />
              提醒您，此頁為小店永豐計畫報名資料建檔，填寫後不可修改，請仔細填寫
            </p>
            <form class="">
              <p class="mb-2">
                <span class="u-text-primary">*</span> 聯絡人姓名
              </p>
              <input required class="p-form-input pl-3 pb-2 u-mb-200" placeholder="請輸入聯絡人姓名" />
              <p class="mb-2">
                <span class="u-text-primary">*</span> 聯絡人電話
              </p>
              <input required class="p-form-input pl-3 pb-2 u-mb-200" placeholder="建議格式：0900123456" />
              <p class="mb-2">
                <span class="u-text-primary">*</span> 聯絡人信箱
              </p>
              <input required class="p-form-input pl-3 pb-2 u-mb-200" placeholder="Example@gmail.com" />
              <p class="mb-2">
                <span class="u-text-primary">*</span> 小店名稱
              </p>
              <input required class="p-form-input pl-3 pb-2 u-mb-300" placeholder="請輸入小店名稱" />
              <p class="mb-2">
                <span class="u-text-primary">*</span> 小店地址
              </p>
              <div class="form-row pb-2 u-mb-100">
                <div class="col-4">
                  <select required name="" id="" class="p-form-select pl-3 ">
                    <option value="" selected disabled>選擇縣市</option>
                    <option value="">台北市</option>
                  </select>
                </div>
                <div class="col-4">
                  <select required name="" id="" class="p-form-select pl-3 ">
                    <option value="" selected disabled>選擇鄉鎮區</option>
                    <option value="">大安區</option>
                  </select>
                </div>
                <div class="col-4">
                  <select required name="" id="" class="p-form-select pl-3 ">
                    <option value="" selected disabled>選擇路街</option>
                    <option value="">八德路二段</option>
                  </select>
                </div>
              </div>
              <input required class="p-form-input pl-3 pb-2 u-mb-300" placeholder="請輸入地址" />
              <div class="d-flex u-mb-200 p-form-link">
                <label class="mx-auto p-form-checkbox">
                  <input type="checkbox" class="checkbox" required>
                  <span class="checkmark checkmark-2"></span>
                  <span>我已詳細閱讀並且同意
                    <a href="https://demo.ai-ad.com.tw/2022/sinopac_foundation/terms.html"
                      target="_blank">永豐基金會個人資料蒐集條款</a>
                  </span>
                </label>
              </div>
              <div class="d-flex">
                <button class="p-form-button p-form-button-3 mx-auto u-py-100 u-px-500 u-px-md-800" type="submit">
                  下一步
                </button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>
    <!-- =============end 主要內容區 ============= -->
    <!-- ============= footer ============= -->
    <footer id="footer" class="l-footer"></footer>
    <!-- =============end footer ============= -->
  </div>
  <!-- JS Global Compulsory -->
  <script src="assets/plugins/jquery@3.5.1.min.js"></script>
  <script src="assets/plugins/bootstrap@4.5.3/js/bootstrap.min.js"></script>
  <script src="assets/js/main.js"></script>
  <!-- JS Customization -->
</body>

</html>

<!DOCTYPE html>
<html lang="zh-tw">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>永豐基金會 | 申請報名表</title>
  <meta name="keyword" content="關鍵字" />
  <meta name="description" content="描述" />
  <meta name="author" content="作者" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1" charset="UTF-8" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="stylesheet" href="assets/plugins/bootstrap@4.5.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/plugins/fontawesome@5.15.4/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/main.css" />
</head>

<body>
  <noscript>
    <span class="h2 d-block text-center text-light bg-danger p-3 mb-0">
      您的瀏覽器不支援JavaScript功能，若網頁功能無法正常使用時，請開啟瀏覽器JavaScript狀態。
    </span>
  </noscript>
  <div id="page">
    <!-- ============= 導覽列 ============= -->
    <header id="header" class="l-header"></header>
    <!-- =============end 導覽列 ============= -->

    <!-- ============= 主要內容區 ============= -->
    <main>
      <section>
        <div class="container">
          <div class="c-breadcrumbs u-py-100 u-font-14">
            <a href="#" class="mr-2">首頁</a>
            /
            <a href="#" class="mx-2">小店永豐計畫</a>
            /
            <a href="#" class="ml-2">投稿報名</a>
          </div>
        </div>
        <div class="container u-pt-200 u-pb-400 u-pt-md-400 u-pb-md-600">
          <div class="d-flex flex-column text-center justify-content-center">
            <p class="u-text-primary m-0 u-pb-050">Application Form</p>
            <h3 class="u-font-weight-600 m-0 u-pb-250">
              小店永豐計畫
            </h3>
            <p class="u-text-primary u-font-16 mb-2 d-md-none">Step 2</p>
            <div class="d-flex justify-content-center align-items-center u-pb-400">
              <div class="pb-2">
                <p class="u-text-primary u-font-14 mb-1 d-none d-md-block">
                  &ensp;
                </p>
                基本資料
              </div>
              <img class="u-px-100 u-pb-050 u-pb-md-000 u-pt-md-100" src="assets/img/form/arrow.svg" />
              <div class="p-form-step pb-2">
                <p class="u-text-primary u-font-14 mb-1 d-none d-md-block">
                  Step 2
                </p>
                公司資料
              </div>
              <img class="u-px-100 u-pb-050 u-pb-md-000 u-pt-md-100" src="assets/img/form/arrow.svg" />
              <div class="pb-2">
                <p class="u-text-primary u-font-14 mb-1 d-none d-md-block">
                  &ensp;
                </p>
                審核資料
              </div>
              <img class="u-px-100 u-pb-050 u-pb-md-000 u-pt-md-100" src="assets/img/form/arrow.svg" />
              <div class="pb-2">
                <p class="u-text-primary u-font-14 mb-1 d-none d-md-block">
                  &ensp;
                </p>
                其他資料
              </div>
            </div>
          </div>
          <div class="p-form-title mx-auto">
            <div class="d-flex u-pb-250">
              <div class="p-form-title-line col"></div>
              <div class="position-relative p-form-title-textbox-2">
                <div class="p-form-title-text">公司基本資料</div>
              </div>
              <div class="p-form-title-line col"></div>
            </div>
            <p class="m-0 u-pb-200">建構完成，請繼續填寫以下其他資料。</p>
            <form class="">
              <p class="mb-2">
                <span class="u-text-primary">*</span>
                公司名稱（請輸入完整公司名稱）
              </p>
              <input class="p-form-input pl-3 pb-2 u-mb-200" placeholder="" />
              <p class="mb-2">
                <span class="u-text-primary">*</span>
                統一編號（限輸入8個數字）
              </p>
              <input class="p-form-input pl-3 pb-2 u-mb-200" placeholder="請輸入數字字元" />
              <p class="mb-2">
                <span class="u-text-primary">*</span> 代表人姓名
              </p>
              <input class="p-form-input pl-3 pb-2 u-mb-200" placeholder="請輸入真實姓名" />
              <p class="mb-2">
                <span class="u-text-primary">*</span> 資本總額（新臺幣/元）
              </p>
              <input class="p-form-input pl-3 pb-2 u-mb-200" placeholder="請輸入數字字元" />
              <p class="mb-2 pl-3">商業登記證號</p>
              <input class="p-form-input pl-3 pb-2 u-mb-200" placeholder="請輸入數字字元" />
              <p class="mb-2 pl-3">小店網站網址</p>
              <input class="p-form-input pl-3 pb-2 u-mb-400" placeholder="請輸入網址" />
              <div class="d-flex">
                <button class="p-form-button p-form-button-3 ml-auto u-mr-100 u-py-100 u-px-250 u-px-md-500" type="">
                  上一步
                </button>
                <button class="p-form-button p-form-button-3 mr-auto u-py-100 u-px-250 u-px-md-500" type="">
                  下一步
                </button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>
    <!-- =============end 主要內容區 ============= -->
    <!-- ============= footer ============= -->
    <footer id="footer" class="l-footer"></footer>
    <!-- =============end footer ============= -->
  </div>
  <!-- JS Global Compulsory -->
  <script src="assets/plugins/jquery@3.5.1.min.js"></script>
  <script src="assets/plugins/bootstrap@4.5.3/js/bootstrap.min.js"></script>
  <script src="assets/js/main.js"></script>
  <!-- JS Customization -->
</body>

</html>
